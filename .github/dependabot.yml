# Dependabot следит и за действиями в пайплайнах.
#
# Все сторонние actions закреплены на SHA коммита, а не на тег: тег владелец
# репозитория может переставить на любой коммит, и его код выполнится с
# нашими токенами. Один из них работает в задаче, которая получает ключ
# подписи обновлений, — там это самая дорогая мишень во всём проекте.
#
# Закрепив SHA, легко потерять обновления безопасности, поэтому обновляет их
# этот же бот: раз в неделю открывается pull request с новым SHA, который
# достаточно посмотреть и слить. Ничего поддерживать руками не нужно.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    # Обновление SHA не должно само собой попадать в релиз.
    open-pull-requests-limit: 5