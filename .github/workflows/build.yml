name: Build

# Attaches the installers to a release that Release Please has already created.
#
# Started through workflow_dispatch by release.yml: the tag is created with the
# repository's own GITHUB_TOKEN, and a push made with that token does not start
# a workflow run. workflow_dispatch is the exception that makes the handover
# possible.
#
# Can also be started by hand to rebuild a release:
#   gh workflow run build.yml --ref main -f tag=v1.0.4

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v1.0.4"
        required: true

permissions:
  contents: write

concurrency:
  # One build at a time, whatever the tag.
  #
  # Two builds running together would both write the release assets and
  # latest.json, and whichever finished last would win, which is how an older
  # build ends up advertised as the latest and offers downgrades to everyone
  # on auto-update.
  #
  # The limit is worth knowing: GitHub keeps one run pending in a group and
  # cancels the older pending ones. A release whose build was displaced this
  # way ends up without installers, which the last job reports. Rebuild one by
  # hand: gh workflow run build.yml --ref main -f tag=v1.1.1
  group: build
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A stuck job must not hold a runner for the six hours GitHub allows.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-14
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: ""
          - name: Linux
            os: ubuntu-22.04
            target: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      # The action above installs its targets for `stable`, while the build uses
      # the channel pinned in `rust-toolchain.toml`. Targets are installed per
      # channel, so the Intel build came up without its target and failed at the
      # very end with "Target x86_64-apple-darwin is not installed". Here `rustup`
      # reads the file and resolves the channel the build will actually use.
      - name: Install the configured build target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The updater compares the version in the binary with the one in the
      # release manifest. If they ever disagree the green banner silently
      # stops appearing, so the checkout is checked against the tag first.
      - name: Verify the tag matches the sources
        shell: bash
        run: |
          set -euo pipefail
          # The number is taken with a pattern rather than by stripping a "v"
          # prefix: tags produced before include-component-in-tag was turned
          # off are named like `QuiTa-v1.1.0`, and both must build.
          expected="$(printf '%s' "$TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          if [ -z "$expected" ]; then
            echo "::error::Cannot find a version in the tag '$TAG'."
            exit 1
          fi
          found="$(node -p "require('./package.json').version")"
          if [ "$found" != "$expected" ]; then
            echo "::error::The checkout says $found but the tag says $expected."
            exit 1
          fi
          node scripts/bump-version.mjs --check "$TAG"
        env:
          TAG: ${{ inputs.tag }}

      # Updater artifacts are enabled through a separate config file rather
      # than tauri.conf.json: the flag makes a local `pnpm tauri build` fail on
      # a machine that has no signing key, and contributors must be able to
      # build without any secret. This produces latest.json and the .sig files
      # that the in-app update banner reads. A release built without the
      # signing secret is still installable; it just has no latest.json, so the
      # app will not offer an update. Check for that file in the release.
      # The manifest this step writes is an intermediate: four jobs racing for
      # one file means the last upload wins and its manifest knows only its own
      # platforms. The manifest job below rebuilds one authoritative manifest
      # from the signatures this step leaves behind.
      - name: Build and publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: QuiTa ${{ inputs.tag }}
          releaseBody: See docs/DISTRIBUTION.md for install instructions.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --config src-tauri/tauri.updater.conf.json

  # One authoritative latest.json, assembled from the signatures already on
  # the release. This must be a separate job: inside a single build, all four
  # platform jobs write latest.json at the same time, and whoever uploads last
  # wins with a manifest that knows only its own platforms — on release 1.5.0
  # the Intel macOS job won, so Apple Silicon, Windows and Linux updaters
  # found no row for themselves and silently offered no update. Rebuilding
  # from the .sig files after every job has finished cannot lose that race,
  # and a signature missing for any platform fails here loudly.
  manifest:
    name: Updater manifest
    needs: build
    runs-on: ubuntu-latest
    # A stuck job must not hold a runner for the six hours GitHub allows.
    timeout-minutes: 10
    steps:
      # `node` is preinstalled on the runner; the script comes from the commit
      # being built, so a checkout is required even though it touches no
      # source file.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Rebuild latest.json from the release signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          node scripts/merge-updater-json.mjs \
            --tag "$TAG" --repo "${{ github.repository }}" --upload

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    # A stuck job must not hold a runner for the six hours GitHub allows.
    timeout-minutes: 15
    steps:
      # `gh release download` resolves the repository through git, so this job
      # fails without a checkout even though it touches no source file.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          # Two patterns on purpose: the RPM is named `QuiTa-1.2.0-1.x86_64.rpm`
          # with a hyphen while everything else uses an underscore. A single
          # `QuiTa_*` silently skipped the RPM, so it reached the release with
          # no hash at all.
          gh release download "$TAG" --dir dist \
            --pattern "QuiTa_*" --pattern "QuiTa-*"

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      # The comment below claims the file covers every artifact. That claim is
      # only worth anything if something checks it: a release that grows a new
      # bundle, or one renamed to a pattern this job does not match, would
      # otherwise ship without a hash and nobody would notice until a user
      # could not verify their download.
      - name: Verify the checksums cover the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          missing=0
          while read -r name; do
            [ -n "$name" ] || continue
            # The manifest itself and the updater index are not artifacts.
            case "$name" in
              SHA256SUMS|latest.json) continue ;;
            esac
            if ! grep -q " $name$" dist/SHA256SUMS; then
              echo "::error::$name is in the release but not in SHA256SUMS"
              missing=1
            fi
          done <<< "$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if [ "$missing" -ne 0 ]; then
            echo "::error::Every artifact needs a hash; the installer refuses to trust a file without one."
            exit 1
          fi
          echo "Every artifact has a hash in SHA256SUMS."

      # The installer scripts refuse to install a binary whose hash is missing
      # from this file, so it must cover every artifact. The step above fails
      # the build when one is not listed, because a release that quietly loses
      # an installer is exactly the case that is only noticed by a user.
      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/SHA256SUMS --clobber

  # Builds queue behind each other, so a release can be skipped: GitHub cancels
  # the older of two pending runs. The release still exists, it just has no
  # files, and nobody notices until someone tries to install that version.
  report-unbuilt-releases:
    name: Check every release has files
    needs: [build, checksums]
    runs-on: ubuntu-latest
    # A stuck job must not hold a runner for the six hours GitHub allows.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Warn about releases left without installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          empty=0
          while read -r tag; do
            [ -n "$tag" ] || continue
            count="$(gh release view "$tag" --json assets --jq '.assets | length')"
            if [ "$count" -eq 0 ]; then
              echo "::warning::$tag has no files. Its build was displaced by a newer one."
              echo "::warning::Rebuild it with: gh workflow run build.yml --ref main -f tag=$tag"
              empty=1
            fi
          done <<< "$(gh release list --limit 10 --json tagName --jq '.[].tagName')"
          if [ "$empty" -eq 1 ]; then
            echo "At least one release has no installers. The newest one was built."
          else
            echo "Every recent release has installers."
          fi
