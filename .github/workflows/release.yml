name: Release

# Release Please drives versioning, changelog and tags.
#
#   commits into main → a "chore(main): release v1.1.1" pull request appears
#   CI goes green     → that pull request is merged automatically
#   the merge         → tag + GitHub Release created
#   the build is then dispatched separately
#
# A release still travels through a pull request, so the version bump and the
# changelog stay visible in history instead of appearing out of nowhere. What
# changed is who presses the button: the second job below waits for the CI of
# the very commit that produced the release, and merges the pull request once
# that run is green.
#
# The gate is the CI run on main, not the checks on the release PR itself.
# Release Please creates that PR with the repository's GITHUB_TOKEN, and events
# caused by that token do not start workflow runs, so there are no checks on
# that branch to wait for.
#
# Commits that do not deserve a release (docs, ci, chore, test) still produce no
# pull request at all.
#
# Why the build is dispatched instead of running on the tag push: release
# Please creates the tag with the repository's GITHUB_TOKEN, and GitHub does
# not start a workflow run from actions performed with that token — that
# restriction exists to stop tokens from recursing. `workflow_dispatch` is the
# documented exception, so it is used to hand the tag to build.yml.
  #
  # The same restriction applies to the merge below, and it has a consequence
  # worth writing down: the merge is done by this workflow's token, so the push
  # it makes into main does **not** start the run that would create the tag. The
  # release therefore finishes on the *next* run — the scheduled one, or a manual
  # `workflow_dispatch`. That is not a stall to be debugged: it is what GitHub
  # does with a token that merges a pull request.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A release that never got created used to stay invisible: nothing in this
  # workflow noticed that 1.2.1 was merged as a pull request but never became a
  # tag, so seven consecutive runs failed with nobody alerted. The check below
  # compares what the manifest promises against what GitHub actually has.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run build.yml` needs this: without it the dispatch to the
  # build workflow is refused with "Resource not accessible by integration".
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Decide the release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      # Consumed by the merge job: the pull request to merge is named here, not
      # looked up by its title, because a title can be forged by anyone.
      prs: ${{ steps.release.outputs.prs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Report
        env:
          RELEASED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            echo "::notice::Релиз $TAG создан, запускаю сборку."
          elif [ -n "$PRS" ]; then
            echo "::notice::Открыт PR с подъёмом версии — он слиется автоматически, как пройдёт CI."
          else
            echo "Изменений, достойных релиза, нет (docs/ci/chore в changelog не попадают)."
          fi

      # The one trigger that a GITHUB_TOKEN is still allowed to start.
      - name: Hand the tag to the build workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run build.yml --ref main -f tag="$TAG"

  # Merges the release PR once the CI of the commit that produced it is green.
  #
  # Three ways this deliberately does nothing, each of which is a normal state
  # rather than a fault:
  #
  #   * CI is red          -> the release waits, so a broken main never ships;
  #   * CI never finishes  -> the wait times out and the release waits for a human;
  #   * main moved on      -> this PR is stale, Release Please will update it and
  #                           the next push to main will merge the fresh one.
  merge-release-pr:
    name: Merge release PR after CI is green
    needs: release-please
    runs-on: ubuntu-latest
    # No guard on `released` here, and the reason is a run that did both things.
    #
    # When Release Please finished a release it had already merged, it also
    # opened the pull request for the next one. Skipping this job because "a
    # release was created" left that pull request standing until some later push
    # came along to merge it — a day away, in a repository that is quiet.
    #
    # Nothing here needs the guard. The step below takes its number from the
    # action's own output and leaves early on every case it cannot handle: no
    # pull request reported, the pull request closed, a branch that is not
    # Release Please's, a base that moved on.
    permissions:
      contents: write
      pull-requests: write
      # Approving the release pull request's own CI run. Branch protection
      # requires every check to report, and a run opened by the repository token
      # is held as `action_required` until someone approves it — no jobs, no
      # checks, no merge. See the approval step below.
      actions: write
    steps:
      - name: Wait for CI, then merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RELEASE_PRS: ${{ needs.release-please.outputs.prs }}
        run: |
          set -euo pipefail

          # The number comes from Release Please itself, never from a search by
          # title. The repository is public, so anyone can open a pull request
          # called "chore(main): release 9.9.9" and wait; a title search would
          # find theirs first, because gh lists the newest first. Branch
          # protection is a second lock on that door, not a reason to leave it
          # unlocked: the impostor branch cannot pass six required checks by
          # claiming to be a release.
          number="$(printf '%s' "$RELEASE_PRS" | jq -r '.[0].number // empty' 2>/dev/null || true)"
          if [ -z "$number" ]; then
            echo "Release Please reported no pull request, so there is nothing to merge."
            exit 0
          fi

          # Belt and braces: the pull request must still be the one Release
          # Please created, still open, and sitting on the current main.
          read -r head_branch head_oid state < <(gh pr view "$number" --repo "$REPO" \
            --json headRefName,headRefOid,state --jq '[.headRefName, .headRefOid, .state] | join(" ")')
          if [ "$state" != "OPEN" ]; then
            echo "::notice::Release PR #$number is $state, not open."
            exit 0
          fi
          case "$head_branch" in
            release-please--*) ;;
            *)
              echo "::warning::PR #$number comes from $head_branch, not from Release Please."
              exit 0 ;;
          esac
          echo "Release PR #$number, waiting for CI on $SHA"

          # GitHub reports a run that is still going as an empty string rather
          # than null, and jq treats "" as true, so `// "pending"` would pass it
          # through and the case below would read it as a failed check.
          conclusion=""
          for _ in $(seq 1 120); do
            conclusion="$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" \
              --json conclusion --jq '.[0].conclusion' || true)"
            if [ -z "$conclusion" ] || [ "$conclusion" = "null" ]; then
              conclusion="pending"
            fi
            case "$conclusion" in
              success) break ;;
              pending) sleep 30 ;;
              *)
                echo "::warning::CI is not green ($conclusion) - the release waits for a human."
                exit 0 ;;
            esac
          done

          if [ "$conclusion" != "success" ]; then
            echo "::warning::CI did not finish in time - the release waits for a human."
            exit 0
          fi

          # The release pull request needs checks of its own. Branch protection
          # on main requires every CI job by name, and the checks a pull request
          # carries are read from its own head commit — the green run on main is
          # a different commit and does not count for it. Release Please opened
          # this pull request with the repository token, and GitHub holds such
          # runs as `action_required`: no jobs are scheduled, so no check ever
          # reports, and the merge stays blocked until a person approves it.
          #
          # So this job approves that run itself, and only after the checks
          # above: the number came from Release Please, the branch is a
          # release-please-- one, the pull request is open, and its base is the
          # commit this run was triggered by. An approval costs nothing even in
          # the worst case — that run only reads code — and the code on the
          # branch is what the green run on main has just built.
          run_id=""
          for _ in $(seq 1 20); do
            run_id="$(gh api "repos/$REPO/actions/runs?head_sha=$head_oid" \
              --jq '[.workflow_runs[]
                     | select(.name == "CI")
                     | select(.conclusion == "action_required")][0].id // empty' \
              2>/dev/null || echo "")"
            [ -n "$run_id" ] && break
            sleep 15
          done

          if [ -z "$run_id" ]; then
            echo "::notice::No held CI run found on the release branch."
          elif gh api -X POST "repos/$REPO/actions/runs/$run_id/approve" >/dev/null 2>&1; then
            echo "::notice::Approved CI run $run_id on the release branch."
          else
            echo "::warning::Could not approve run $run_id - the release waits for a human:"
            echo "::warning::https://github.com/$REPO/actions/runs/$run_id"
            exit 0
          fi

          # Now the checks protection actually waits for. "Skipped" is the
          # expected result here, not a problem: a version bump needs no build,
          # and every build it would repeat was green on main one commit earlier.
          verdict=""
          for _ in $(seq 1 40); do
            verdict="$(gh pr checks "$number" --repo "$REPO" --json state --jq '
              if length == 0 then "pending"
              elif any(.[]; .state
                    | IN("FAILURE", "ERROR", "CANCELLED", "TIMED_OUT",
                         "ACTION_REQUIRED", "STALE")) then "fail"
              elif all(.[]; .state | IN("SUCCESS", "SKIPPED")) then "ok"
              else "pending" end' 2>/dev/null || echo "pending")"
            case "$verdict" in
              ok) break ;;
              pending) sleep 15 ;;
              *)
                echo "::warning::A check on the release PR is not green - the release waits for a human."
                exit 0 ;;
            esac
          done

          if [ "$verdict" != "ok" ]; then
            echo "::warning::The release PR checks did not finish in time - the release waits for a human."
            exit 0
          fi

          # main moving after the PR was written makes this PR describe an
          # older main, and merging it would release a commit that is no longer
          # the tip.
          base="$(gh pr view "$number" --repo "$REPO" --json baseRefOid --jq .baseRefOid)"
          if [ "$base" != "$SHA" ]; then
            echo "::notice::main moved on to $base - this PR updates on the next push."
            exit 0
          fi

          # GitHub refuses the merge for a moment after the last check reports,
          # because it has not recomputed the branch policy yet. It says so
          # plainly — "the base branch policy prohibits the merge" — and the pull
          # request is, in fact, mergeable a second later.
          #
          # On this repository that race is not a corner case but the normal
          # case: every job on a release branch is skipped, so the checks go green
          # instantly without a runner, and the merge is attempted in the same
          # breath. A single attempt lost the release; five more cost a minute.
          merged=""
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$number" --repo "$REPO" --squash --delete-branch; then
              merged="yes"
              break
            fi
            echo "GitHub has not recomputed the policy yet (attempt $attempt of 6)."
            sleep 10
          done

          if [ "$merged" != "yes" ]; then
            echo "::error::PR #$number stayed unmergeable although its checks passed."
            exit 1
          fi
          echo "::notice::PR #$number merged, the tag builds on the next run."

  # Compares what the manifest promises against what GitHub actually holds.
  # This exists because the failure it looks for is silent by nature: a release
  # pull request gets merged, the version bump lands in the files, and if the
  # tag is never created nothing anywhere says so. The installer keeps handing
  # out the previous release, and an app built from the current code never
  # offers an update, because it compares its version against a newer one that
  # was published.
  audit-release:
    name: Every merged version reached a release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading the release pull requests is half of this check: the other half
      # is their label, and with no permission to read them the check would
      # silently have nothing to look at.
      pull-requests: read
    steps:
      - name: Compare the manifest with the published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          checkout="$(mktemp -d)"
          trap 'rm -rf "$checkout"' EXIT
          git clone --quiet --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$checkout"

          promised="$(sed -n 's/.*"\.": *"\([^"]*\)".*/\1/p' "$checkout/.release-please-manifest.json")"
          if [ -z "$promised" ]; then
            echo "::error::could not read a version out of the release-please manifest"
            exit 1
          fi

          # The release list lags the manifest by a couple of seconds: the tag and
          # the release are two API calls, and this job starts at the same moment
          # as the one that makes them. Reading once meant a red run every single
          # time a release *did* come out — the check could only ever report
          # failure, and a check that cannot pass teaches nobody to read it.
          #
          # So it waits, and it says it is waiting. The wait is bounded and short:
          # a genuinely missing release is not going to turn up half a minute
          # later, and a check that hangs forever is a check nobody trusts.
          latest=""
          for _ in $(seq 1 12); do
            latest="$(gh release list --repo "$REPO" --limit 20 --json tagName \
              --jq '[.[].tagName | select(startswith("v"))] | first // ""')"
            [ "${latest#v}" = "$promised" ] && break
            sleep 5
          done

          echo "manifest promises: $promised"
          echo "newest release:    ${latest:-none}"

          if [ -z "$latest" ]; then
            echo "::error::the repository has no releases at all"
            exit 1
          fi

          # Strip the leading v, then compare numerically field by field. A
          # string comparison would put "1.2.10" before "1.2.9".
          newest="${latest#v}"
          if [ "$promised" != "$newest" ]; then
            echo "::error::version $promised is recorded as released but the newest tag is $latest. A release was merged and never published; /releases/latest serves $newest, so the installer is behind the code."
            exit 1
          fi

          # The other half of the same promise, and the half that was missing.
          # Release Please finds merged release pull requests by this label and
          # swaps it for `autorelease: tagged` once the release exists. If that
          # call fails, the label stays, and every later run retries that same
          # pull request first and fails the same way — while the check above
          # stays green, because whoever hit the failure restored the tag and the
          # release by hand. That is how 1.2.1 froze every release: a 403 on
          # create-a-release, which passed `target_commitish` for a tag that had
          # already been made by hand, and nothing but a red mark to show it.
          #
          # A release still in flight is not stuck: merging the release pull
          # request is what writes the manifest, so its version equals the
          # manifest's. Only a version behind the manifest can be a wedged one.
          stale=""
          while read -r number version; do
            [ -n "$number" ] || continue
            lower="$(printf '%s\n%s\n' "$version" "$promised" | sort -V | sed -n 1p)"
            if [ "$version" != "$promised" ] && [ "$lower" = "$version" ]; then
              stale="${stale} #${number} (${version})"
            fi
          done < <(gh pr list --repo "$REPO" --state merged --label "autorelease: pending" \
            --limit 50 --json number,title \
            --jq '.[] | select(.title | test("release [0-9]+\\.[0-9]+\\.[0-9]+")) | "\(.number) \(.title | capture("release (?<v>[0-9]+\\.[0-9]+\\.[0-9]+)").v)"')

          # Printed even when it is empty. A check that prints nothing on the
          # way through cannot be told apart from one that never looked, and
          # this half is exactly the one that was silently missing.
          echo "release pull requests still pending:${stale:- none}"

          if [ -n "$stale" ]; then
            echo "::error::release pull request(s)$stale still carry the pending label while the manifest says $promised. They were never released by Release Please, and every run retries them instead of releasing anything new. Tell it they are done: gh pr edit <number> --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'"
            exit 1
          fi

          echo "every merged version reached a release"
