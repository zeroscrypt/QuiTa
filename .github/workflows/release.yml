name: Release

# Release Please drives versioning, changelog and tags.
#
#   commits into main → a "chore(main): release v1.0.5" pull request appears
#   merging that PR   → tag + GitHub Release created
#   the build is then dispatched separately
#
# The release is deliberately a pull request rather than a push: it means the
# version bump and the changelog are reviewed like any other change, and
# commits that do not deserve a release (docs, CI) produce no pull request at
# all.
#
# Why the build is dispatched instead of running on the tag push: release
# Please creates the tag with the repository's GITHUB_TOKEN, and GitHub does
# not start a workflow run from actions performed with that token — that
# restriction exists to stop tokens from recursing. `workflow_dispatch` is the
# documented exception, so it is used to hand the tag to build.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run build.yml` needs this: without it the dispatch to the
  # build workflow is refused with "Resource not accessible by integration".
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Decide the release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Report
        env:
          RELEASED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            echo "::notice::Релиз $TAG создан, запускаю сборку."
          elif [ -n "$PRS" ]; then
            echo "::notice::Открыт PR с подъёмом версии — посмотрите его перед слиянием."
          else
            echo "Изменений, достойных релиза, нет (docs/ci/chore в changelog не попадают)."
          fi

      # The one trigger that a GITHUB_TOKEN is still allowed to start.
      - name: Hand the tag to the build workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run build.yml --ref main -f tag="$TAG"