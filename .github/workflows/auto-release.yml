name: Auto release

# Publishes a release when something shippable lands in main.
#
#   merge into main → next patch version → tag vX.Y.Z → release.yml builds
#
# The tag chain is the source of truth: the next patch is derived from the
# newest existing `v*` tag, so no version has to be edited by hand beforehand.
#
# This workflow decides *whether* there is something to publish and under which
# tag. The build itself lives in release.yml.

on:
  push:
    branches: [main]
    # A pull request that only touched documentation produces no binary, so it
    # produces no release and no update prompt for people who never open the
    # README. The bot's own version commit is filtered separately below.
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  bump:
    # The version commit is itself a push into main, which would restart this
    # workflow forever. The author's identity is checked at the trigger level
    # so the loop cannot even start.
    if: github.actor != 'github-actions[bot]'
    name: Bump version and tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Belt to the actor check's braces: if HEAD is already the newest tag,
      # there is genuinely nothing new to ship.
      - name: Check whether there is something to release
        id: check
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          head="$(git rev-parse HEAD)"
          echo "newest tag: ${latest:-none}"
          echo "HEAD:       $head"
          if [ -n "$latest" ] && [ "$(git rev-list -n1 "$latest")" = "$head" ]; then
            echo "HEAD is already released as $latest — nothing to do."
            echo "todo=false" >> "$GITHUB_OUTPUT"
          else
            echo "todo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        id: version
        if: steps.check.outputs.todo == 'true'
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [ -n "$latest" ]; then
            current="${latest#v}"
          else
            current="$(node -p "require('./package.json').version")"
          fi
          next="$(node --input-type=module -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if ([major, minor, patch].some(Number.isNaN)) {
              console.error("cannot parse " + process.argv[1]); process.exit(1);
            }
            console.log(`${major}.${minor}.${patch + 1}`);
          ' "$current")"
          echo "releasing ${current} → ${next}"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      # Written to the same three files a person would edit by hand, so the
      # repository can never disagree with what was published.
      - name: Bump version
        if: steps.check.outputs.todo == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/bump-version.mjs "$TAG"

      # The updater compares the version in the binary with the one in the
      # release manifest. If they ever disagree the banner silently stops
      # appearing, so the bump is verified rather than trusted.
      - name: Verify the bump
        if: steps.check.outputs.todo == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/bump-version.mjs --check "$TAG"

      - name: Commit and tag
        if: steps.check.outputs.todo == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "Версия $TAG"
          # Someone may have merged something else while this job ran.
          git pull --rebase origin main
          git push origin HEAD:main
          git tag -a "$TAG" -m "QuiTa $TAG"
          git push origin "$TAG"

      - name: Result
        if: always()
        env:
          TODO: ${{ steps.check.outputs.todo }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$TODO" = "true" ]; then
            echo "::notice::Тег $TAG отправлен, release.yml собирает релиз."
          else
            echo "Новых изменений для релиза нет."
          fi