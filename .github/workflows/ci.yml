name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Release Please opens its pull request with the repository token, and
    # GitHub holds `pull_request` workflows on such a branch until a person
    # approves them. Nobody ever does, so the branch collected eleven runs that
    # waited forever and checked nothing. The version bump is already covered by
    # the CI of the main commit it is built from.
    branches-ignore:
      - 'release-please--**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides what is actually worth building.
  #
  # A typo in the README does not change a single byte of the application, yet
  # the Tauri build produces installers for three platforms and takes about
  # fifteen minutes. Two out of every five commits to main were documentation or
  # pipeline work, so this was the single largest source of wasted runner time.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The comparison needs the previous commit, which a shallow clone does
          # not have.
          fetch-depth: 0

      - id: filter
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          head="${{ github.sha }}"

          # On the first push to a new branch there is nothing to compare
          # against, and the whole tree is treated as changed.
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "app=yes" >> "$GITHUB_OUTPUT"
            echo "rust=yes" >> "$GITHUB_OUTPUT"
            echo "No base commit to compare against; building everything."
            exit 0
          fi

          changed="$(git diff --name-only "$before" "$head")"

          if printf '%s\n' "$changed" \
            | grep -qE '^(src/|src-tauri/|tests/|scripts/|package\.json|pnpm-lock\.yaml)'; then
            echo "app=yes" >> "$GITHUB_OUTPUT"
            echo "rust=yes" >> "$GITHUB_OUTPUT"
          else
            echo "app=no" >> "$GITHUB_OUTPUT"
            # Prose still reaches the Rust tests: the documentation guard reads
            # both READMEs and the screenshots they link to, so a commit that
            # only edits them still has to run that suite. Skipping it on the
            # strength of "no code changed" would quietly stop checking exactly
            # the thing that changed.
            if printf '%s\n' "$changed" \
              | grep -qE '(\.md$|^docs/|^\.github/|^CONTRIBUTING\.md|^SECURITY\.md)'; then
              echo "rust=yes" >> "$GITHUB_OUTPUT"
            else
              echo "rust=no" >> "$GITHUB_OUTPUT"
            fi
            echo "Only files outside the build were touched:"
            printf '%s\n' "$changed" | sed 's/^/  /'
          fi

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Advisories appear over time without anyone touching the code, so the
      # dependencies have to be re-checked on every run rather than on the days
      # someone remembers to.
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'yes'
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's Linux dependencies are needed to *build* the crate at all, not
      # only to bundle it: without them `glib-sys` fails in its build script.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # rustls 0.23.45 sat in the lock file with four advisories through months
      # of green runs: nothing in the code had changed, only the advisory
      # database. The two ignored entries are build-time crates with no fix
      # available; both are recorded in docs/DISTRIBUTION.md.
      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Cargo.lock lives next to the crate, not at the repository root.
          # Without this the action compiles cargo-audit for two minutes and
          # then fails looking for a file that was never there.
          working-directory: src-tauri
          ignore: RUSTSEC-2024-0370, RUSTSEC-2024-0429

  tauri-build-macos:
    needs: changes
    if: needs.changes.outputs.app == 'yes'
    name: Tauri build (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm tauri build

  tauri-build-windows:
    needs: changes
    if: needs.changes.outputs.app == 'yes'
    name: Tauri build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The installer script is what users run first, and a syntax error in it
      # is invisible until someone copies a command from the README.
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host 'install.ps1 parses cleanly'

      - name: Build app
        run: pnpm tauri build

  tauri-build-linux:
    needs: changes
    if: needs.changes.outputs.app == 'yes'
    name: Tauri build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The installer script is what users run first, and a syntax error in it
      # is invisible until someone copies a command from the README. Checked
      # here rather than on macOS, whose bash is still 3.2.
      - name: Parse install.sh
        run: bash -n scripts/install.sh && echo 'install.sh parses cleanly'

      - name: Build app
        run: pnpm tauri build
