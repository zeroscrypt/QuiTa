name: CI

on:
  push:
    branches: [main]
  # Release Please's pull request is left out of the jobs, not out of the
  # triggers. For `pull_request` the branch filters look at the branch a pull
  # request *targets*, which is always `main` here — never at the branch it
  # comes from, which is the one that needed skipping. Eleven runs waited
  # forever on exactly that misunderstanding. The condition is on the jobs,
  # where `github.head_ref` is the branch that matters; see `changes`.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default, as the GitHub security guide asks: "It's good security
# practice to set the default permission for the GITHUB_TOKEN to read access
# only for repository contents." Nothing in CI writes to the repository.
#
# This matters because CI also runs on pull requests, and the `rust` job
# compiles the code from that pull request — so build.rs and the test binaries
# run while the job holds a token. Without this block the token would inherit
# the repository default, which is `write`. A fork would still get a read-only
# token, but a branch pushed into the repository itself would not.
permissions:
  contents: read

jobs:
  # Decides what is actually worth building.
  #
  # A typo in the README does not change a single byte of the application, yet
  # the Tauri build produces installers for three platforms and takes about
  # fifteen minutes. Two out of every five commits to main were documentation or
  # pipeline work, so this was the single largest source of wasted runner time.
  changes:
    name: What changed
    # A pull request from a release-please-- branch carries a version bump and a
    # changelog, nothing else: the code on it was already built by the CI of the
    # commit it was built from. So no job here has work to do.
    #
    # It still has to *report*. Branch protection on main lists every job in
    # this file as required, and the two things that look the same are not: a
    # skipped job reports success, while a workflow left out of the run never
    # reports at all and blocks the pull request forever.
    #
    # `github.event_name` is here because `head_ref` is empty on a push, and the
    # push to main that carries the release itself has to be checked as usual.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    # A stuck job must not hold a runner for the six hours GitHub allows.
    timeout-minutes: 10
    outputs:
      app: ${{ steps.filter.outputs.app }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The comparison needs the previous commit, which a shallow clone does
          # not have.
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head="$HEAD_SHA"

          # A push event carries the previous head in `before`. A pull request
          # event has no such field at the top level, so it arrived empty, the
          # base commit did not resolve, and every pull request concluded
          # "nothing to compare against" — three full Tauri builds for a
          # one-line workflow edit. On a pull request the base of comparison is
          # the merge base with the branch it targets.
          if [ "$EVENT" = "pull_request" ]; then
            before="$(git merge-base "$BASE_SHA" "$head" 2>/dev/null || true)"
          else
            before="$BEFORE"
          fi

          # With nothing to compare against, the whole tree is treated as changed.
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "app=yes" >> "$GITHUB_OUTPUT"
            echo "rust=yes" >> "$GITHUB_OUTPUT"
            echo "No base commit to compare against; building everything."
            exit 0
          fi

          changed="$(git diff --name-only "$before" "$head")"

          if printf '%s\n' "$changed" \
            | grep -qE '^(src/|src-tauri/|tests/|scripts/|package\.json|pnpm-lock\.yaml|vite\.config\.ts|svelte\.config\.js|tsconfig\.json|pnpm-workspace\.yaml|\.npmrc)'; then
            echo "app=yes" >> "$GITHUB_OUTPUT"
            echo "rust=yes" >> "$GITHUB_OUTPUT"
          else
            echo "app=no" >> "$GITHUB_OUTPUT"
            # Prose still reaches the Rust tests: the documentation guard reads
            # both READMEs and the screenshots they link to, so a commit that
            # only edits them still has to run that suite. Skipping it on the
            # strength of "no code changed" would quietly stop checking exactly
            # the thing that changed.
            if printf '%s\n' "$changed" \
              | grep -qE '(\.md$|^docs/|^\.github/|^CONTRIBUTING\.md|^SECURITY\.md)'; then
              echo "rust=yes" >> "$GITHUB_OUTPUT"
            else
              echo "rust=no" >> "$GITHUB_OUTPUT"
            fi
            echo "Only files outside the build were touched:"
            printf '%s\n' "$changed" | sed 's/^/  /'
          fi

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    # The same reason as in `changes`, and the same need to report. `rust` and
    # the three Tauri builds inherit the skip through `needs: changes`; this job
    # has no such dependency, so it carries its own condition.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    # A stuck job must not hold a runner for the six hours GitHub allows.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Advisories appear over time without anyone touching the code, so the
      # dependencies have to be re-checked on every run rather than on the days
      # someone remembers to.
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'yes'
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    # A stuck job must not hold a runner for the six hours GitHub allows.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Tauri's Linux dependencies are needed to *build* the crate at all, not
      # only to bundle it: without them `glib-sys` fails in its build script.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # rustls 0.23.45 sat in the lock file with four advisories through months
      # of green runs: nothing in the code had changed, only the advisory
      # database. The ignored entries are recorded in docs/DISTRIBUTION.md with
      # the reason for each; none of them has a fix that does not mean moving the
      # whole framework to a release candidate.
      #
      # `zip` 4.6.1 is the hard one: three real advisories from October 2026
      # (symlinks escaping the destination directory, and SUID bits preserved
      # through extraction), fixed only in 9.x. It is reached through
      # `tauri-plugin-updater`, and the newest 2.x still requires 4.x — leaving
      # the 3.0 alpha, which drags Tauri itself into a release candidate.
      #
      # The path that uses it does not run here, and that is checked rather than
      # assumed: `zip` is used in exactly one place in the plugin, inside the
      # Windows updater and only when the downloaded asset *is* a zip archive.
      # Our releases ship an `.msi` and its signature, and the signature is
      # verified before anything is extracted — so the vulnerable branch is
      # unreachable on our platforms and our assets.
      #
      # This is a command, not rustsec/audit-check, and the difference is the
      # whole point. That action also publishes its result as a check run, which
      # needs the `checks: write` permission this workflow deliberately does not
      # grant. The day the database first reported a yanked crate it made the
      # job fall over with "403 on create-a-check-run" while the audit itself had
      # found nothing wrong — a job that failed about reporting, not about the
      # dependencies. Reading the lock file and the database needs no
      # permission at all, and a command also keeps working for pull requests
      # from forks, whose token cannot write anything.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        # Cargo.lock lives next to the crate, not at the repository root.
        working-directory: src-tauri
        run: >-
          cargo audit
          --ignore RUSTSEC-2024-0370
          --ignore RUSTSEC-2024-0429
          --ignore RUSTSEC-2026-0367
          --ignore RUSTSEC-2026-0368
          --ignore RUSTSEC-2026-0369

  tauri-build-macos:
    needs: changes
    if: needs.changes.outputs.app == 'yes'
    name: Tauri build (macOS Apple Silicon)
    runs-on: macos-14
    # A stuck job must not hold a runner for the six hours GitHub allows.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm tauri build

  tauri-build-windows:
    needs: changes
    if: needs.changes.outputs.app == 'yes'
    name: Tauri build (Windows)
    runs-on: windows-latest
    # A stuck job must not hold a runner for the six hours GitHub allows.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The installer script is what users run first, and a syntax error in it
      # is invisible until someone copies a command from the README.
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host 'install.ps1 parses cleanly'

      - name: Build app
        run: pnpm tauri build

      # Producing an MSI proves only that the bundler ran. Whether it installs,
      # whether the executable lands where Windows expects it, and whether the
      # app survives its own startup are three separate questions, and on
      # Windows all three have their own way of failing.
      - name: Install and start the app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Searched for rather than hardcoded. The first version of this test
          # named `bundle\msi` and failed on a path that was correct when it
          # was written and stopped being correct by the next Tauri release -
          # and the failure said only "path not found", with no clue.
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\target\release\bundle'
          $msi = Get-ChildItem -Path $bundle -Filter '*.msi' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $msi) {
            Write-Host "Bundler output tree:"
            Get-ChildItem -Path $bundle -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 30 | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw 'no MSI was produced'
          }
          Write-Host "Installing $($msi.FullName)"

          $install = Start-Process msiexec -Wait -PassThru -ArgumentList @(
            '/i', "`"$($msi.FullName)`"", '/quiet', '/norestart'
          )
          if ($install.ExitCode -ne 0) {
            throw "msiexec failed with exit code $($install.ExitCode)"
          }

          # Not hardcoded: the install directory has moved between Tauri
          # versions, and a path that silently stops existing would turn this
          # into a test that never checks anything.
          $candidates = @(
            "$env:ProgramFiles\QuiTa\quita.exe",
            "${env:ProgramFiles(x86)}\QuiTa\quita.exe",
            "$env:LOCALAPPDATA\QuiTa\quita.exe",
            "$env:LOCALAPPDATA\Programs\QuiTa\quita.exe"
          ) | Where-Object { Test-Path $_ }
          if (-not $candidates) {
            throw 'installed, but the executable is in none of the usual places'
          }
          $exe = @($candidates)[0]
          Write-Host "Installed to $exe"

          # Polled rather than slept for a fixed ten seconds: a cold runner
          # initialises the webview far slower than a warm machine, and a fixed
          # sleep turns a slow start into a red build. The database is created
          # in `setup`, so it appearing is the signal that the app got that far.
          $db = Join-Path $env:APPDATA 'com.quita.app'
          $app = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          $found = $null
          while ((Get-Date) -lt $deadline) {
            $found = Get-ChildItem "$db\quita.db*" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found -or $app.HasExited) { break }
            Start-Sleep -Seconds 2
          }

          if (-not $found) {
            # Say what actually happened. "no database" on its own cannot be
            # acted on, and this test has failed five times without ever
            # explaining itself.
            Write-Host "app pid $($app.Id), exited: $($app.HasExited)"
            if ($app.HasExited) { Write-Host "exit code: $($app.ExitCode)" }
            Write-Host "APPDATA: $env:APPDATA"
            Write-Host "contents of APPDATA:"
            Get-ChildItem $env:APPDATA -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Host "contents of the expected data directory, if any:"
            if (Test-Path $db) {
              Get-ChildItem $db -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
              Write-Host "  (directory does not exist)"
            }
            throw "the app did not create a database in $db within 60 seconds"
          }
          Write-Host "database: $($found.Name)"

          Write-Host "running as pid $($app.Id)"

      - name: Remove the app again
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Get-Process -Name 'quita' | Stop-Process -Force
          Start-Sleep -Seconds 2
          # Uninstalling proves the reverse direction too: an installer that
          # cannot be removed leaves the next run testing a patched machine.
          $msi = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'src-tauri\target\release\bundle') `
            -Filter '*.msi' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($msi) {
            $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/x', "`"$($msi.FullName)`"", '/quiet')
            Write-Host "uninstall exit code $($p.ExitCode)"
          }
          Remove-Item -Recurse -Force "$env:APPDATA\com.quita.app" -ErrorAction SilentlyContinue

  tauri-build-linux:
    needs: changes
    if: needs.changes.outputs.app == 'yes'
    name: Tauri build (Linux)
    runs-on: ubuntu-latest
    # A stuck job must not hold a runner for the six hours GitHub allows.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The installer script is what users run first, and a syntax error in it
      # is invisible until someone copies a command from the README. Checked
      # here rather than on macOS, whose bash is still 3.2.
      - name: Parse install.sh
        run: bash -n scripts/install.sh && echo 'install.sh parses cleanly'

      - name: Build app
        run: pnpm tauri build
